name: workflow.yml
on:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install .venv
        run: pip install .

      - name: Create .env
        run: |
          touch .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "CLAN_TAG=${{ vars.CLAN_TAG }}" >> .env 

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Run
        run: python war_stats.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add war_attacks.csv war_defenses.csv
          git diff --staged --quiet || git commit -m "Update war stats"
          git push